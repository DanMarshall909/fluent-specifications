name: Publish NuGet package suite

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable package-suite version to publish
        required: true
        type: string

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NUGET_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluentSpecifications.slnx

      - name: Verify the release
        run: dotnet test FluentSpecifications.slnx --configuration Release --no-restore -m:1 -nr:false

      - name: Read the selected package version
        id: package-version
        shell: bash
        run: |
          version=$(dotnet msbuild src/FluentSpecifications.Core/FluentSpecifications.Core.csproj -getProperty:PackageVersion -nologo)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The Core project PackageVersion '$version' is not a stable semantic version."
            exit 1
          fi
          if [[ "$version" != "${{ inputs.release_version }}" ]]; then
            echo "::error::Requested release '${{ inputs.release_version }}' does not match project version '$version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify every package version is publishable
        shell: pwsh
        run: |
          $version = '${{ steps.package-version.outputs.version }}'
          ./eng/Assert-NextPackageVersion.ps1 -PackageId 'DanMarshall.FluentSpecifications' -CandidateVersion $version -AllowAlreadyPublished
          ./eng/Assert-NextPackageVersion.ps1 -PackageId 'DanMarshall.FluentSpecifications.Repositories' -CandidateVersion $version -FirstStableVersion $version -AllowAlreadyPublished
          ./eng/Assert-NextPackageVersion.ps1 -PackageId 'DanMarshall.FluentSpecifications.Expressions' -CandidateVersion $version -FirstStableVersion $version -AllowAlreadyPublished
          ./eng/Assert-NextPackageVersion.ps1 -PackageId 'DanMarshall.FluentSpecifications.EntityFrameworkCore' -CandidateVersion $version -FirstStableVersion $version -AllowAlreadyPublished

      - name: Pack package suite ${{ steps.package-version.outputs.version }}
        shell: pwsh
        run: ./eng/Pack-PackageSuite.ps1 -Configuration Release -OutputPath artifacts/packages -NoRestore

      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package suite ${{ steps.package-version.outputs.version }} to NuGet.org
        shell: bash
        run: |
          version='${{ steps.package-version.outputs.version }}'
          for package_id in \
            DanMarshall.FluentSpecifications \
            DanMarshall.FluentSpecifications.Repositories \
            DanMarshall.FluentSpecifications.Expressions \
            DanMarshall.FluentSpecifications.EntityFrameworkCore
          do
            dotnet nuget push "artifacts/packages/${package_id}.${version}.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
