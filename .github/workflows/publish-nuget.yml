name: Publish NuGet package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NUGET_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluentSpecifications.slnx

      - name: Verify the release
        run: dotnet test FluentSpecifications.slnx --configuration Release --no-restore -m:1 -nr:false

      - name: Read the selected package version
        id: package-version
        shell: bash
        run: |
          version=$(dotnet msbuild src/FluentSpecifications.Core/FluentSpecifications.Core.csproj -getProperty:PackageVersion -nologo)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The Core project PackageVersion '$version' is not a stable semantic version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the semantic version is next
        shell: pwsh
        run: ./eng/Assert-NextPackageVersion.ps1 -PackageId 'DanMarshall.FluentSpecifications' -CandidateVersion '${{ steps.package-version.outputs.version }}'

      - name: Pack ${{ steps.package-version.outputs.version }}
        run: dotnet pack src/FluentSpecifications.Core/FluentSpecifications.Core.csproj --configuration Release --no-restore --output artifacts/packages

      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish ${{ steps.package-version.outputs.version }} to NuGet.org
        run: |
          dotnet nuget push artifacts/packages/DanMarshall.FluentSpecifications.${{ steps.package-version.outputs.version }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
